[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tg-ws-android"
dynamic = ["version"]

description = "Telegram MTProto proxy over WebSocket — Android port of tg-ws-proxy"
readme = "README.md"
requires-python = ">=3.8"

license = { name = "MIT", file = "LICENSE" }

authors = [
    { name = "Flowseal" },
    { name = "Arkomiko" },
]

keywords = [
    "telegram",
    "android",
    "proxy",
    "bypass",
    "websocket",
    "mtproto",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Android",
  "Topic :: System :: Networking :: Firewalls",
]

dependencies = [
    "certifi",
    "cryptography",
]

[project.scripts]
tg-ws-proxy = "proxy.tg_ws_proxy:main"

[project.urls]
Source = "https://github.com/Arkomiko/tg-ws-android"
Issues = "https://github.com/Arkomiko/tg-ws-android/issues"
Upstream = "https://github.com/Flowseal/tg-ws-proxy"

[tool.hatch.build.targets.wheel]
packages = ["proxy", "utils"]

[tool.hatch.version]
path = "proxy/__init__.py"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4"]
ignore = ["F403", "F405", "B023"]
